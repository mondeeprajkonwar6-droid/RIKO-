<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riko</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#fff; --fg:#222; --card:#f4f4f7; --accent:#8a5cf6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:16px system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  #sub { position:fixed; left:12px; right:12px; bottom:calc(86px + env(safe-area-inset-bottom));
    max-height:30vh; overflow:auto; background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
    border-radius:14px; padding:10px 14px; font-size:15px; line-height:1.4; display:none; box-shadow:0 2px 12px #0002; }
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; align-items:center;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.92); backdrop-filter:blur(8px); }
  #txt { flex:1; min-width:0; border:1px solid #ccc; border-radius:22px; padding:12px 16px; font-size:16px; background:#fff; color:var(--fg); }
  button { border:0; border-radius:50%; width:48px; height:48px; font-size:22px; background:var(--card); cursor:pointer; flex:none; }
  #mic { background:var(--accent); color:#fff; width:56px; height:56px; }
  #mic.rec { background:#e53935; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  #gear { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:10px; width:42px; height:42px; font-size:20px; box-shadow:0 1px 6px #0003; }
  #status { position:fixed; top:calc(18px + env(safe-area-inset-top)); left:14px; font-size:13px; color:#555;
    background:rgba(255,255,255,.8); padding:4px 10px; border-radius:12px; display:none; }
  #panel { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:10; }
  #panel .card { position:absolute; left:0; right:0; bottom:0; max-height:92vh; overflow:auto; background:#fff;
    border-radius:18px 18px 0 0; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  #panel h2 { margin:0 0 8px; font-size:18px; }
  label { display:block; margin:12px 0 4px; font-size:13px; color:#555; }
  input, select, textarea { width:100%; font:inherit; padding:10px; border:1px solid #ccc; border-radius:10px; background:#fff; color:var(--fg); }
  textarea { min-height:90px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .btn { border-radius:10px; width:auto; height:auto; padding:12px 14px; font-size:15px; background:var(--card); }
  .btn.primary { background:var(--accent); color:#fff; }
  small { color:#777; }
  a { color:var(--accent); }
  #overlay { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:rgba(255,255,255,.9); text-align:center; padding:24px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.1/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<div id="overlay"><div id="ovmsg">Loading Riko...</div>
  <button class="btn primary" id="go" style="display:none">Tap to start</button>
  <div id="vrmpick" style="display:none"><small>Avatar file not found. Pick a .vrm file:</small><br><input type="file" id="vrmfile" accept=".vrm"></div>
</div>
<div id="status"></div>
<button id="gear" aria-label="Settings">⚙️</button>
<div id="sub"></div>
<div id="bar">
  <input id="txt" placeholder="Type or tap the mic..." enterkeyhint="send" autocomplete="off">
  <button id="send" aria-label="Send">➤</button>
  <button id="mic" aria-label="Talk">🎙️</button>
</div>

<div id="panel"><div class="card">
  <h2>Settings</h2>
  <label>AI provider (all have a free tier)</label>
  <select id="provider">
    <option value="groq">Groq (free, fast) – console.groq.com/keys</option>
    <option value="gemini">Google Gemini (free) – aistudio.google.com/apikey</option>
    <option value="openrouter">OpenRouter (free models) – openrouter.ai/keys</option>
    <option value="custom">Custom (any OpenAI-compatible)</option>
  </select>
  <label>API key <small>(stays on this phone only)</small></label>
  <input id="key" type="password" autocomplete="off" placeholder="paste your free key">
  <label>Model</label>
  <input id="model">
  <div id="customUrlWrap" style="display:none">
    <label>Base URL</label><input id="baseUrl" placeholder="https://.../v1">
  </div>
  <label>Personality</label>
  <textarea id="prompt"></textarea>
  <label>Her voice <small>(built into your phone, free)</small></label>
  <select id="voiceSel"></select>
  <div class="row">
    <div><label>Pitch</label><input id="pitch" type="range" min="0.5" max="2" step="0.05"></div>
    <div><label>Speed</label><input id="rate" type="range" min="0.6" max="1.6" step="0.05"></div>
  </div>
  <label>Speech language (microphone)</label>
  <input id="lang" placeholder="en-US">
  <div class="row" style="margin-top:16px">
    <button class="btn" id="test">Test voice</button>
    <button class="btn" id="clear">Forget chat</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="vrmBtn">Change avatar (.vrm)</button>
    <button class="btn primary" id="save">Save</button>
  </div>
  <input type="file" id="vrmfile2" accept=".vrm" style="display:none">
</div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const $ = id => document.getElementById(id);
const PROVIDERS = {
  groq:       { url: 'https://api.groq.com/openai/v1', model: 'llama-3.3-70b-versatile' },
  gemini:     { url: 'https://generativelanguage.googleapis.com/v1beta/openai', model: 'gemini-2.5-flash' },
  openrouter: { url: 'https://openrouter.ai/api/v1', model: 'meta-llama/llama-3.3-70b-instruct:free' },
  custom:     { url: '', model: '' },
};
const DEFAULTS = {
  provider: 'groq', key: '', model: PROVIDERS.groq.model, baseUrl: '',
  prompt: 'You are a helpful assistant named Riko.\nYou speak like a snarky anime girl.\nAlways refer to the user as "senpai".\nKeep replies short (1-3 sentences) because they are spoken out loud.',
  voice: '', pitch: 1.4, rate: 1.05, lang: navigator.language || 'en-US',
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let cfg = { ...DEFAULTS, ...store.get('riko_cfg', {}) };
let history = store.get('riko_history', []);

// ── 3D scene ──
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 20);
const light = new THREE.DirectionalLight(0xffffff, Math.PI);
light.position.set(1, 1, 1);
scene.add(light);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.4; controls.maxDistance = 5;

let vrm = null;
async function loadVRM(url) {
  const loader = new GLTFLoader();
  loader.register(p => new VRMLoaderPlugin(p));
  const gltf = await loader.loadAsync(url);
  if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
  vrm = gltf.userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  scene.add(vrm.scene);
  const arm = vrm.meta.metaVersion === '0' ? -1.3 : 1.3;
  vrm.humanoid.getNormalizedBoneNode('leftUpperArm').rotation.z = -arm;
  vrm.humanoid.getNormalizedBoneNode('rightUpperArm').rotation.z = arm;
  const headY = vrm.humanoid.getNormalizedBoneNode('head').getWorldPosition(new THREE.Vector3()).y;
  camera.position.set(0, headY * 0.94, headY * 1.37);
  controls.target.set(0, headY * 0.9, 0);
  controls.update();
}

// ── Lip sync (phone TTS gives no audio stream, so the mouth is animated while she speaks) ──
let speaking = false, mouth = 0, bump = 0, nextBlink = 2, blink = 0;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (vrm) {
    let target = 0;
    if (speaking) {
      target = 0.25 + 0.55 * Math.abs(Math.sin(t * 11)) * (0.6 + 0.4 * Math.abs(Math.sin(t * 4.3)));
      target = Math.min(1, target + bump);
    }
    bump *= 0.9;
    mouth += (target - mouth) * 0.45;
    vrm.expressionManager.setValue('aa', mouth);
    nextBlink -= dt;
    if (nextBlink < 0) { blink = 1; nextBlink = 2 + Math.random() * 3; }
    blink = Math.max(0, blink - dt * 8);
    vrm.expressionManager.setValue('blink', Math.sin(blink * Math.PI));
    vrm.update(dt);
  }
  controls.update();
  renderer.render(scene, camera);
});

// ── UI helpers ──
const sub = $('sub'), statusEl = $('status');
function say(text) { sub.textContent = text; sub.style.display = text ? 'block' : 'none'; sub.scrollTop = sub.scrollHeight; }
function status(text) { statusEl.textContent = text; statusEl.style.display = text ? 'block' : 'none'; }

// ── Voice out (browser speechSynthesis, free) ──
const synth = window.speechSynthesis;
let voices = [];
function refreshVoices() {
  voices = synth ? synth.getVoices() : [];
  const sel = $('voiceSel');
  sel.innerHTML = '<option value="">Default</option>' +
    voices.map(v => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
  sel.value = cfg.voice;
}
if (synth) { refreshVoices(); synth.onvoiceschanged = refreshVoices; }

function speak(text) {
  return new Promise(resolve => {
    if (!synth) return resolve();
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_`#]/g, ''));
    const v = voices.find(v => v.voiceURI === cfg.voice);
    if (v) { u.voice = v; u.lang = v.lang; }
    u.pitch = +cfg.pitch; u.rate = +cfg.rate;
    u.onboundary = () => { bump = 0.5; };
    u.onstart = () => { speaking = true; };
    u.onend = u.onerror = () => { speaking = false; resolve(); };
    synth.speak(u);
  });
}

// ── LLM ──
async function ask(text) {
  const p = PROVIDERS[cfg.provider];
  const base = (cfg.provider === 'custom' ? cfg.baseUrl : p.url).replace(/\/$/, '');
  if (!cfg.key) throw new Error('Add your free API key in ⚙️ Settings first.');
  history.push({ role: 'user', content: text });
  history = history.slice(-30);
  const res = await fetch(base + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
    body: JSON.stringify({
      model: cfg.model || p.model,
      messages: [{ role: 'system', content: cfg.prompt }, ...history],
    }),
  });
  if (!res.ok) {
    history.pop();
    let msg = res.status + ' ' + res.statusText;
    try { msg = (await res.json()).error?.message || msg; } catch {}
    throw new Error(msg);
  }
  const data = await res.json();
  const answer = (data.choices?.[0]?.message?.content || '').trim();
  history.push({ role: 'assistant', content: answer });
  store.set('riko_history', history);
  return answer;
}

let busy = false;
async function turn(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  try {
    say('You: ' + text); status('Thinking...');
    const answer = await ask(text);
    say(answer); status('');
    await speak(answer);
  } catch (e) {
    status(''); say('⚠️ ' + e.message);
  } finally { busy = false; }
}

// ── Voice in (browser speech recognition, free) ──
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recording = false, finalText = '';
function unlockSpeech() { if (synth) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } }
$('mic').onclick = () => {
  unlockSpeech();
  if (!SR) { say('This browser has no speech recognition. Use Chrome (Android) or Safari (iPhone), or type below.'); return; }
  if (recording) { rec.stop(); return; }
  if (busy) return;
  synth && synth.cancel(); speaking = false;
  rec = new SR();
  rec.lang = cfg.lang; rec.interimResults = true; rec.continuous = false;
  finalText = '';
  rec.onresult = e => {
    let t = '';
    for (const r of e.results) { t += r[0].transcript; if (r.isFinal) finalText = t; }
    if (!finalText) finalText = t;
    say('🎙️ ' + t);
  };
  rec.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') say('⚠️ Mic error: ' + e.error + (e.error === 'not-allowed' ? ' (allow microphone for this site)' : '')); };
  rec.onend = () => {
    recording = false; $('mic').classList.remove('rec'); status('');
    if (finalText) turn(finalText); else if (!sub.textContent.startsWith('⚠️')) say('');
  };
  rec.start(); recording = true; $('mic').classList.add('rec'); status('Listening... tap again when done');
};
$('send').onclick = () => { unlockSpeech(); const v = $('txt').value; $('txt').value = ''; turn(v); };
$('txt').onkeydown = e => { if (e.key === 'Enter') $('send').onclick(); };

// ── Settings ──
function fillPanel() {
  $('provider').value = cfg.provider; $('key').value = cfg.key; $('model').value = cfg.model;
  $('baseUrl').value = cfg.baseUrl; $('prompt').value = cfg.prompt; $('pitch').value = cfg.pitch;
  $('rate').value = cfg.rate; $('lang').value = cfg.lang; $('voiceSel').value = cfg.voice;
  $('customUrlWrap').style.display = cfg.provider === 'custom' ? 'block' : 'none';
}
$('gear').onclick = () => { fillPanel(); $('panel').style.display = 'block'; };
$('provider').onchange = () => {
  const p = $('provider').value;
  $('model').value = PROVIDERS[p].model;
  $('customUrlWrap').style.display = p === 'custom' ? 'block' : 'none';
};
function readPanel() {
  cfg = { provider: $('provider').value, key: $('key').value.trim(), model: $('model').value.trim(),
    baseUrl: $('baseUrl').value.trim(), prompt: $('prompt').value, voice: $('voiceSel').value,
    pitch: $('pitch').value, rate: $('rate').value, lang: $('lang').value.trim() || 'en-US' };
}
$('save').onclick = () => { readPanel(); store.set('riko_cfg', cfg); $('panel').style.display = 'none'; };
$('panel').onclick = e => { if (e.target === $('panel')) $('panel').style.display = 'none'; };
$('test').onclick = () => { readPanel(); unlockSpeech(); speak("If you can hear this, my voice is working, senpai."); };
$('clear').onclick = () => { history = []; store.set('riko_history', []); say('Memory cleared.'); $('panel').style.display = 'none'; };
$('vrmBtn').onclick = () => $('vrmfile2').click();
async function pickVRM(file) { if (file) { await loadVRM(URL.createObjectURL(file)); $('overlay').remove(); $('panel').style.display = 'none'; } }
$('vrmfile2').onchange = e => pickVRM(e.target.files[0]);
$('vrmfile').onchange = e => pickVRM(e.target.files[0]);

// ── Boot ──
try {
  await loadVRM('avatar.vrm');
  $('ovmsg').textContent = 'Riko is ready!';
  $('go').style.display = 'block';
  $('go').onclick = () => { unlockSpeech(); $('overlay').remove(); if (!cfg.key) $('gear').click(); };
} catch (e) {
  $('ovmsg').textContent = 'Could not load the avatar.';
  $('vrmpick').style.display = 'block';
}
</script>
</body>
</html>
